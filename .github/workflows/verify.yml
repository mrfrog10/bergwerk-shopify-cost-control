name: Verify model

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LibreOffice (for formula recalculation)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc-nogui
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Build, recalculate and check the workbook, then build the report
        run: python run_all.py
      - name: Oracle and scenario tests
        run: python -m pytest -q
      - name: Upload report, charts and recalculated workbook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            report/
            docs/
            build/BergWerk_Shopify_Cost_Control_calculated.xlsx
